name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Lint, format & link check
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint and format check
        run: npm run lint

      - name: List lint (entry rules and README navigation)
        run: npm run lint:list

      - name: List linter tests
        run: node --test scripts/lint-list.test.mjs

      - name: Link check
        run: node scripts/link-check.mjs

  awesome-lint:
    name: Awesome lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint README against the Awesome list guidelines
        env:
          # awesome-lint reads the repository description, topics and licence from the GitHub API.
          github_token: ${{ secrets.GITHUB_TOKEN }}
        run: npm run lint:awesome
