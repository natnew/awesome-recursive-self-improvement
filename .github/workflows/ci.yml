name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Lint, format & link check
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint and format check
        run: npm run lint

      - name: Link check
        run: node scripts/link-check.mjs

  apm-audit:
    name: APM install & audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install APM CLI
        run: pip install apm-cli

      - name: Enable APM registry support
        run: apm experimental enable registries

      - name: Install and audit APM agent dependencies
        env:
          CONTEXT7_API_KEY: ci-placeholder
        run: |
          apm install --target claude,copilot
          apm audit --ci
