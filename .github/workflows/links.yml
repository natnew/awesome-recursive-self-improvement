name: Link check

# Weekly network check of every link. On failure it opens an issue with the report (or
# comments on the open one); when links recover it closes that issue.
on:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: link-check
  cancel-in-progress: false

env:
  ISSUE_TITLE: "Weekly link check found problems"

jobs:
  links:
    name: Network link check
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      # The link checker has no dependencies, so no install step is needed.
      - name: Check links
        id: check
        continue-on-error: true
        env:
          CHECK_LINKS: "1"
          LINK_REPORT: link-report.md
        run: node scripts/link-check.mjs

      - name: Open or update the link-check issue
        if: steps.check.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          printf '\nRun: %s\n' "$RUN_URL" >> link-report.md
          number=$(gh issue list --state open --search "in:title \"$ISSUE_TITLE\"" --json number --jq '.[0].number')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body-file link-report.md
          else
            gh issue create --title "$ISSUE_TITLE" --label bug --body-file link-report.md
          fi

      - name: Close the link-check issue when links recover
        if: steps.check.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          number=$(gh issue list --state open --search "in:title \"$ISSUE_TITLE\"" --json number --jq '.[0].number')
          if [ -n "$number" ]; then
            gh issue close "$number" --comment "The weekly link check passed; closing."
          fi

      - name: Fail the run when links are broken
        if: steps.check.outcome == 'failure'
        run: exit 1
