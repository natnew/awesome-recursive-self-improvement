name: awesome-recursive-self-improvement
version: 1.0.0
description: Curated awesome-list of resources on recursive self-improvement in AI.
includes: auto
author: natnew
license: MIT

# Agent tooling is declared here by reference (Agent Package Manager) rather than
# committing the maintainer's local agents/, skills/, hooks/, instructions/, plugins/
# and workflows/ libraries (which stay git-ignored). `apm install` materializes these
# into the consumer's agent folders; `apm.lock.yaml` pins resolved sources + hashes.
dependencies:
  apm:
    - microsoft/apm/packages/autopilot/autopilot-issue-triage-scheduler#main
    - microsoft/apm/packages/autopilot/autopilot-issue-triage-worker#main
    - microsoft/apm/packages/autopilot/autopilot-comment#main
  mcp:
    - context7

scripts: {}
