name: awesome-recursive-self-improvement
version: 1.0.0
description: Curated awesome-list of resources on recursive self-improvement in AI.
includes: auto
author: natnew
license: MIT

# Agent tooling is declared here by reference (Agent Package Manager) rather than
# committing the maintainer's local agents/, skills/, hooks/, instructions/, plugins/
# and workflows/ libraries (which stay git-ignored). `apm install` materializes these
# into the consumer's agent folders; `apm.lock.yaml` pins resolved sources + hashes.
dependencies:
  apm:
    # Pinned to the microsoft/apm v0.32.0 release commit so upstream package moves on
    # main cannot break CI. Bump the SHA deliberately when updating these packages.
    - microsoft/apm/packages/autopilot/autopilot-issue-triage-scheduler#f0509d75f2b35d11c8e983456e90e101768f1ecc
    - microsoft/apm/packages/autopilot/autopilot-issue-triage-worker#f0509d75f2b35d11c8e983456e90e101768f1ecc
    - microsoft/apm/packages/autopilot/autopilot-comment#f0509d75f2b35d11c8e983456e90e101768f1ecc
  mcp:
    - context7

scripts: {}
